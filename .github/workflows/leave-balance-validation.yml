name: Leave Balance Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-leave-balances:
    name: Validate leave balances
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run leave-balance validation
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_leave_balance.py 2>&1 | tee validation-result.txt

      - name: Start employee portal
        run: |
          python app.py > portal.log 2>&1 &
          echo $! > portal.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat portal.log
          exit 1

      - name: Run Selenium login tests
        run: python -m unittest tests/test_employee_login.py -v

      - name: Add result to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Leave Balance Validation"
            echo
            echo '```text'
            cat validation-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
